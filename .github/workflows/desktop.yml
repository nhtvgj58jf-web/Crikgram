name: Windows-EXE
on:
  workflow_dispatch:
    inputs:
      app_package:
        description: "Свой id (для GUID приложения)"
        default: "app.crikgram.messenger"
      app_name:
        description: "Имя приложения (задаёт папку данных)"
        default: "Crikgram Desktop"
      client_repo:
        default: "loyldg/mytelegram-tdesktop"
      client_ref:
        default: "layer224"
      config:
        default: "Release"
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with: { path: own }
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.client_repo }}
          ref: ${{ inputs.client_ref }}
          submodules: recursive
          path: TBuild/tdesktop
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography
      - name: Patch server + app id
        shell: bash
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          RSA_PUBLIC_PEM: ${{ secrets.RSA_PUBLIC_PEM }}
          APP_PACKAGE: ${{ inputs.app_package }}
          APP_NAME: ${{ inputs.app_name }}
        run: python own/.github/scripts/patch_client.py desktop TBuild/tdesktop
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      # Кэш с прогрессом: у каждого запуска свой ключ, а restore-keys берёт самый свежий
      # прошлый кэш с тем же хэшем prepare.py. prepare.py сам пропускает уже собранные библиотеки.
      - name: Restore libraries cache
        uses: actions/cache/restore@v4
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
          key: libs-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            libs-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/prepare.py') }}-
      # nasm 3.x (его ставит msys2 сейчас) стабильно падает (код -1073741819) на Debug-сборке libvpx:
      # там генератор проекта передаёт флаг -gcv8. Release (без флага) собирается нормально.
      # Убираем флаг: патчим build_libvpx_win.sh из репозитория patches (он лежит в кэше библиотек).
      - name: Fix libvpx Debug (убрать -gcv8)
        shell: bash
        run: |
          f=TBuild/Libraries/patches/build_libvpx_win.sh
          if [ ! -f "$f" ]; then echo "нет $f (кэш пуст), правка не применена"; exit 0; fi
          if grep -q "gcv8-fix" "$f"; then echo "правка уже есть"; else
            cat > "$f.new" <<'EOS'
          # gcv8-fix: nasm 3.x падает на -gcv8, убираем флаг в генераторе проекта
          if [ -f build/make/gen_msvs_vcxproj.sh ]; then
            sed -i 's/ -gcv8//g' build/make/gen_msvs_vcxproj.sh
            echo "gcv8 осталось в gen_msvs_vcxproj.sh: $(grep -c gcv8 build/make/gen_msvs_vcxproj.sh)"
          fi
          EOS
            cat "$f" >> "$f.new"
            mv "$f.new" "$f"
          fi
          head -8 "$f"
      - name: Build libraries (до 2 попыток, прогресс сохраняется)
        id: build_libs
        continue-on-error: true
        shell: cmd
        working-directory: TBuild
        run: |
          for /L %%i in (1,1,2) do (
            python tdesktop\Telegram\build\prepare\prepare.py silent && exit /b 0
            echo Attempt %%i failed, retrying
          )
          exit /b 1
      - name: Save libraries cache
        if: ${{ always() && steps.build_libs.conclusion != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
          key: libs-${{ hashFiles('TBuild/tdesktop/Telegram/build/prepare/prepare.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Stop if libraries failed
        if: ${{ steps.build_libs.outcome == 'failure' }}
        shell: cmd
        run: exit /b 1
      - name: Configure
        shell: cmd
        working-directory: TBuild/tdesktop/Telegram
        run: configure.bat x64 -D TDESKTOP_API_TEST=ON -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON
      - name: Build
        shell: cmd
        working-directory: TBuild/tdesktop
        run: cmake --build out --config ${{ inputs.config }} --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: crikgram-windows-${{ inputs.config }}
          path: |
            TBuild/tdesktop/out/${{ inputs.config }}/Telegram.exe
            TBuild/tdesktop/out/${{ inputs.config }}/Updater.exe
