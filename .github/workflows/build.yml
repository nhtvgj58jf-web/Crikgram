name: Inspect-clients-2

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout android layer224
        uses: actions/checkout@v4
        with:
          repository: loyldg/mytelegram-android
          ref: layer224
          path: android

      - name: Checkout tdesktop layer224
        uses: actions/checkout@v4
        with:
          repository: loyldg/mytelegram-tdesktop
          ref: layer224
          path: tdesktop

      - name: Android details
        run: |
          cd android
          git log -1 --format='%H %ad %s'
          echo "=== LAYER ==="; grep -n "LAYER = " TMessagesProj/src/main/java/org/telegram/tgnet/TLRPC.java | head -3
          echo "=== gradle.properties ==="; cat gradle.properties | sed -E 's/((pass|key|store)[A-Za-z_]*=).*/\1<HIDDEN>/I'
          echo "=== BuildVars ==="; grep -n -E "APP_ID|APP_HASH|BUILD_VERSION|PLAYSTORE|DEBUG_VERSION" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java | sed -E 's/(APP_HASH *= *)"[^"]*"/\1"<hash>"/' | head -12
          echo "=== ConnectionsManager IP ==="; grep -n -B6 -A10 '192.168.1.100' TMessagesProj/jni/tgnet/ConnectionsManager.cpp | head -60
          echo "=== Datacenter.cpp RSA ==="; grep -n -B3 -A14 'BEGIN RSA PUBLIC KEY' TMessagesProj/jni/tgnet/Datacenter.cpp | head -70
          echo "=== Handshake.cpp RSA ==="; grep -n -B3 -A14 'BEGIN RSA PUBLIC KEY' TMessagesProj/jni/tgnet/Handshake.cpp | head -70
          echo "=== modules/variants ==="; ls TMessagesProj_AppStandalone; cat settings.gradle | head -30
          echo "=== google-services ==="; grep -rn "google-services" --include=*.gradle . | head -10; ls TMessagesProj/google-services.json TMessagesProj_App/google-services.json 2>&1 | head
          echo "=== README ==="; head -60 README.md

      - name: Desktop details
        run: |
          cd tdesktop
          git log -1 --format='%H %ad %s'
          echo "=== dc_options ==="; sed -n 1,90p Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp
          echo "=== RSA places ==="; grep -n -B2 -A12 'BEGIN RSA PUBLIC KEY' Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp | head -80
          echo "=== win.yml ==="; head -220 .github/workflows/win.yml
          echo "=== api id ==="; grep -rn -E "TDESKTOP_API_ID|TDESKTOP_API_HASH" --include=*.yml --include=*.cmake --include=CMakeLists.txt --include=*.md . | head -15
          echo "=== docs build windows ==="; ls docs | head -20
