name: Inspect-clients

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout loyldg/mytelegram-android
        uses: actions/checkout@v4
        with:
          repository: loyldg/mytelegram-android
          path: android

      - name: Checkout loyldg/mytelegram-tdesktop
        uses: actions/checkout@v4
        with:
          repository: loyldg/mytelegram-tdesktop
          path: tdesktop

      - name: Android info
        run: |
          cd android
          echo "=== branches ==="; git ls-remote --heads https://github.com/loyldg/mytelegram-android | sed 's/.*refs\/heads\///' | head -30
          echo "=== default branch / last commit ==="; git log -1 --format='%H %ad %s'
          echo "=== top level ==="; ls
          echo "=== layer ==="; grep -rn "LAYER = " --include=*.java . | head -5 || true
          echo "=== RSA key ==="; grep -rln "BEGIN RSA PUBLIC KEY" . | head -10 || true
          echo "=== DC addresses (192.168 / 10. / localhost) ==="; grep -rn -E "192\.168\.[0-9]+\.[0-9]+" --include=*.java --include=*.cpp --include=*.h --include=*.gradle . | head -20 || true
          echo "=== applicationId ==="; grep -rn "applicationId" --include=*.gradle . | head -10 || true
          echo "=== workflows ==="; ls .github/workflows 2>/dev/null || echo none

      - name: Desktop info
        run: |
          cd tdesktop
          echo "=== branches ==="; git ls-remote --heads https://github.com/loyldg/mytelegram-tdesktop | sed 's/.*refs\/heads\///' | head -30
          echo "=== default branch / last commit ==="; git log -1 --format='%H %ad %s'
          echo "=== top level ==="; ls
          echo "=== RSA key ==="; grep -rln "BEGIN RSA PUBLIC KEY" . | head -10 || true
          echo "=== DC addresses ==="; grep -rn -E "192\.168\.[0-9]+\.[0-9]+" --include=*.cpp --include=*.h --include=*.txt --include=*.cmake . | head -20 || true
          echo "=== workflows ==="; ls .github/workflows 2>/dev/null || echo none
